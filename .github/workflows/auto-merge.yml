name: Dependabot

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependabot:
    name: Auto Merge
    uses: Staffbase/gha-workflows/.github/workflows/template_automerge_dependabot.yml@a38088448bfd106dbabe9f3b88f8cc8c88aaec83 # v15.1.1
    with:
      force: true
    secrets:
      app_id: ${{ vars.STAFFBASE_ACTIONS_APP_ID }}
      private_key: ${{ secrets.STAFFBASE_ACTIONS_PRIVATE_KEY }}
